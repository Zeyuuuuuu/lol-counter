<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOL counter 速查</title>
<!--INLINE_CSS-->
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <h1>LOL counter 速查</h1>
    <select id="region" aria-label="地区">
      <option value="world">全球</option>
      <option value="kr">韩服</option>
      <option value="na1">北美</option>
      <option value="euw1">欧西</option>
    </select>
  </div>
  <div class="ver" id="ver">数据版本 …</div>
</header>
<main>
  <nav class="dims" id="dims" aria-label="维度">
    <button type="button" data-dim="lane" class="active">分路 Counter</button>
    <button type="button" data-dim="duo">下路组合</button>
    <button type="button" data-dim="aram">大乱斗</button>
  </nav>
  <div class="searchbox">
    <input id="q" type="search" placeholder="搜英雄：塔姆 / tahm…" autocomplete="off" enterkeyhint="search" aria-label="搜索英雄">
    <ul id="suggest" class="suggest" hidden></ul>
  </div>
  <div class="recent" id="recent"></div>
  <section id="sec-lane">
    <div class="regionhint" id="laneregionhint" hidden></div>
    <nav class="lanes" id="lanes" aria-label="位置"></nav>
    <div class="champhead" id="champhead"></div>
    <div class="tabs" id="tabs">
      <button type="button" data-mode="countered" class="active">克制它的</button>
      <button type="button" data-mode="counters">它克制的</button>
    </div>
    <div class="results" id="results"></div>
    <div class="legend" id="legend">
      颜色按<span class="b">对手胜率</span>：
      <span class="dot red"></span>≥57% 硬counter
      <span class="dot orange"></span>54–57%
      <span class="dot amber"></span>52–54%
      <span class="dot gray"></span>50–52%
      <span class="dot green"></span>&lt;50% 它被压制少
    </div>
  </section>
  <section id="sec-duo" hidden>
    <div class="duometa" id="duometa"></div>
    <div id="duoresults"></div>
  </section>
  <section id="sec-aram" hidden>
    <div class="regionhint" id="aramregion"></div>
    <div class="aramhero" id="aramhero" hidden></div>
    <div class="duotitle" id="aramtitle">大乱斗胜率榜</div>
    <div id="aramresults"></div>
  </section>
  <footer class="src" id="src"></footer>
</main>
<!--INLINE_DATA-->
<!--INLINE_JS-->
</body>
</html>
