<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOL counter 速查</title>
<style>
:root{
  --bg:#0b0f1a; --card:#141a2b; --card2:#1a2136; --line:#26304a;
  --text:#eef1f7; --muted:#9aa3b8;
  --red:#f04444; --orange:#fb7c1e; --amber:#f5b301; --gray:#8b93a7; --green:#2fbf71;
  --accent:#3b82f6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.topbar{padding:14px 16px 10px;background:linear-gradient(180deg,#10182c,#0b0f1a);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:20px;letter-spacing:.5px}
#region{min-height:40px;font-size:14px;border-radius:10px;padding:0 10px;
  border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.ver{margin-top:4px;font-size:12px;color:var(--muted)}
main{padding:12px 12px 40px;max-width:640px;margin:0 auto}
.searchbox{position:relative}
#q{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
#q:focus{border-color:var(--accent)}
.suggest{list-style:none;margin:6px 0 0;padding:0;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.suggest li{padding:12px 14px;font-size:16px;border-bottom:1px solid var(--line);cursor:pointer}
.suggest li:last-child{border-bottom:0}
.suggest li:active{background:#232c48}
.suggest .en{color:var(--muted);font-size:12px;margin-left:8px}
.suggest .nohit{color:var(--muted);font-size:14px;cursor:default}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.recent:empty{display:none}
.rtitle{width:100%;font-size:12px;color:var(--muted)}
.chip{padding:8px 14px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:14px;color:var(--text);cursor:pointer}
.chip:active{background:#232c48}
.lanes{display:flex;gap:8px;margin:14px 0}
.lanes button{flex:1;min-height:44px;font-size:16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.lanes button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.champhead{margin:2px 0 10px}
.champhead .zh{font-size:22px;font-weight:700}
.champhead .en{font-size:13px;color:var(--muted);margin-left:8px}
.buildsum{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.6}
.buildline{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--muted);line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;min-height:44px;font-size:15px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.tabs button.active{background:#1e2a4d;color:#fff;border-color:var(--accent);font-weight:600}
.dims{display:flex;gap:8px;margin-bottom:12px}
.dims button{flex:1;min-height:44px;font-size:15px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.dims button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.row{background:var(--card);
  border:1px solid var(--line);border-left:5px solid var(--gray);
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.rowtop{display:flex;align-items:center;gap:10px}
.row.band-red{border-left-color:var(--red)}
.row.band-orange{border-left-color:var(--orange)}
.row.band-amber{border-left-color:var(--amber)}
.row.band-gray{border-left-color:var(--gray)}
.row.band-green{border-left-color:var(--green)}
.rname{flex:1;min-width:0;font-size:16px}
.rname .en{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.rstats{text-align:right;flex-shrink:0}
.oppwr{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.oppwr.red{color:var(--red)} .oppwr.orange{color:var(--orange)}
.oppwr.amber{color:var(--amber)} .oppwr.gray{color:var(--gray)}
.oppwr.green{color:var(--green)}
.badge{display:inline-block;font-size:11px;background:var(--red);color:#fff;
  border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:3px}
.games{font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.nodata,.starthint{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
.legend{font-size:12px;color:var(--muted);margin-top:14px;line-height:2}
.legend .b{color:var(--text);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px 0 8px;vertical-align:0}
.dot.red{background:var(--red)} .dot.orange{background:var(--orange)}
.dot.amber{background:var(--amber)} .dot.gray{background:var(--gray)}
.dot.green{background:var(--green)}
.src{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}
.duometa{font-size:12px;color:var(--muted);margin:2px 0 10px;line-height:1.7}
.duotitle{font-size:15px;font-weight:700;margin:12px 0 8px}
.duoback{min-height:44px;padding:0 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--card2);color:var(--text);
  font-size:14px;cursor:pointer;margin-bottom:4px}
.duoback:active{background:#232c48}
.duorow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-left:5px solid var(--accent);
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.dname{flex:1;min-width:0;font-size:16px}
.dname .en{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.duoworst{margin-top:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);padding:0 12px}
.duoworst summary{min-height:44px;display:flex;align-items:center;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--muted);list-style:none}
.duoworst summary::-webkit-details-marker{display:none}
.duoworst[open] summary{border-bottom:1px solid var(--line)}
.duoworst .duorow{margin:8px 0}
.regionhint{font-size:12px;color:var(--muted);margin:2px 0 8px;line-height:1.7}
.regionhint:empty{display:none}
.aramhero{background:var(--card2);border:1px solid var(--accent);border-radius:10px;
  padding:12px 14px;margin-bottom:8px}
.aramhero .aname{font-size:18px;font-weight:700}
.aramhero .aname .en{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.aramhero .astats{display:flex;gap:18px;margin-top:8px;font-size:14px}
.aramhero .astats b{font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.aramhero .astats span{font-size:12px;color:var(--muted);display:block}
.aramrow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.aramrow.hl{border-color:var(--accent);background:#1a2340}
.arank{width:34px;flex-shrink:0;font-size:15px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:center}
.aramrow:nth-child(-n+3) .arank{color:var(--amber)}

</style>
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <h1>LOL counter 速查</h1>
    <select id="region" aria-label="地区">
      <option value="world">全球</option>
      <option value="kr">韩服</option>
      <option value="na1">北美</option>
      <option value="euw1">欧西</option>
    </select>
  </div>
  <div class="ver" id="ver">数据版本 …</div>
</header>
<main>
  <nav class="dims" id="dims" aria-label="维度">
    <button type="button" data-dim="lane" class="active">分路 Counter</button>
    <button type="button" data-dim="duo">下路组合</button>
    <button type="button" data-dim="aram">大乱斗</button>
  </nav>
  <div class="searchbox">
    <input id="q" type="search" placeholder="搜英雄：塔姆 / tahm…" autocomplete="off" enterkeyhint="search" aria-label="搜索英雄">
    <ul id="suggest" class="suggest" hidden></ul>
  </div>
  <div class="recent" id="recent"></div>
  <section id="sec-lane">
    <div class="regionhint" id="laneregionhint" hidden></div>
    <nav class="lanes" id="lanes" aria-label="位置"></nav>
    <div class="champhead" id="champhead"></div>
    <div class="tabs" id="tabs">
      <button type="button" data-mode="countered" class="active">克制它的</button>
      <button type="button" data-mode="counters">它克制的</button>
    </div>
    <div class="results" id="results"></div>
    <div class="legend" id="legend">
      颜色按<span class="b">对手胜率</span>：
      <span class="dot red"></span>≥57% 硬counter
      <span class="dot orange"></span>54–57%
      <span class="dot amber"></span>52–54%
      <span class="dot gray"></span>50–52%
      <span class="dot green"></span>&lt;50% 它被压制少
    </div>
  </section>
  <section id="sec-duo" hidden>
    <div class="duometa" id="duometa"></div>
    <div id="duoresults"></div>
  </section>
  <section id="sec-aram" hidden>
    <div class="regionhint" id="aramregion"></div>
    <div class="aramhero" id="aramhero" hidden></div>
    <div class="duotitle" id="aramtitle">大乱斗胜率榜</div>
    <div id="aramresults"></div>
  </section>
  <footer class="src" id="src"></footer>
</main>
<script src="assets/data-champions.js"></script>
<script src="assets/data-counters.js"></script>
<script src="assets/data-builds.js"></script>
<script src="assets/data-duos.js"></script>
<script src="assets/data-aram.js"></script>

<script>
/* LOL counter 速查 — 纯静态，无外部请求 */
(function () {
  "use strict";

  var CHAMPS = (window.__CHAMPIONS__ && window.__CHAMPIONS__.champions) || {};
  var META = window.__COUNTERS__ ? window.__COUNTERS__.meta : {};
  var DATA = window.__COUNTERS__ ? window.__COUNTERS__.data : {};
  var BUILDS = window.__BUILDS__ ? window.__BUILDS__.data : {};
  var DUOS = window.__DUOS__ || null;
  var ARAM = window.__ARAM__ || null;

  var LANES = [
    ["top", "上"], ["jungle", "野"], ["middle", "中"],
    ["bottom", "下"], ["support", "辅"]
  ];
  var REGIONS = [
    ["world", "全球"], ["kr", "韩服"], ["na1", "北美"], ["euw1", "欧西"]
  ];
  var DIMS = ["lane", "duo", "aram"];
  var LS_LANE = "lolcounter.lane";
  var LS_RECENT = "lolcounter.recent";
  var LS_REGION = "lolcounter.region";

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), suggestEl = $("suggest"), recentEl = $("recent"),
      lanesEl = $("lanes"), headEl = $("champhead"),
      tabsEl = $("tabs"), resEl = $("results"),
      verEl = $("ver"), srcEl = $("src"),
      dimsEl = $("dims"), secLane = $("sec-lane"),
      secDuo = $("sec-duo"), secAram = $("sec-aram"),
      duoMetaEl = $("duometa"), duoResEl = $("duoresults"),
      aramMetaEl = $("aramregion"), aramHeroEl = $("aramhero"),
      aramTitleEl = $("aramtitle"), aramResEl = $("aramresults"),
      regionEl = $("region"), laneRegionHintEl = $("laneregionhint");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* 英雄名：builds/duos 里只有 slug，用 champions.json 映射；映射不到显示 slug 本身 */
  function nameOf(slug) {
    return CHAMPS[slug] || { zh: slug, en: slug };
  }

  /* ---------- 状态 ---------- */
  var state = {
    slug: null,
    lane: "top",
    region: "world",
    mode: "countered", // "countered" 克制它的 / "counters" 它克制的
    dim: "lane",       // "lane" 分路 Counter / "duo" 下路组合 / "aram" 大乱斗
    duoBack: false,    // duo tab 里点过「← 回全榜」
    recent: []
  };
  try {
    var savedLane = localStorage.getItem(LS_LANE);
    if (savedLane && LANES.some(function (l) { return l[0] === savedLane; })) {
      state.lane = savedLane;
    }
    var savedRegion = localStorage.getItem(LS_REGION);
    if (savedRegion && REGIONS.some(function (r) { return r[0] === savedRegion; })) {
      state.region = savedRegion;
    }
    state.recent = JSON.parse(localStorage.getItem(LS_RECENT) || "[]");
    if (!Array.isArray(state.recent)) state.recent = [];
    state.recent = state.recent.filter(function (s) { return CHAMPS[s]; }).slice(0, 8);
  } catch (e) { /* localStorage 不可用时降级 */ }

  function saveRecent() {
    try { localStorage.setItem(LS_RECENT, JSON.stringify(state.recent)); } catch (e) {}
  }

  /* ---------- 时间格式化（北京时间） ---------- */
  function fmtBJ(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso || "未知";
    try {
      var p = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit",
        day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(d).reduce(function (o, x) { o[x.type] = x.value; return o; }, {});
      return p.year + "-" + p.month + "-" + p.day + " " + p.hour + ":" + p.minute;
    } catch (e) {
      return iso;
    }
  }

  verEl.textContent = "数据版本 " + (META.patch || window.__CHAMPIONS__.patch || "未知") +
    " · 更新于 " + fmtBJ(META.scraped_at || window.__CHAMPIONS__.scraped_at) + "（北京时间）";
  srcEl.textContent = "数据来源：" + (META.source || "—") + " · 全球" +
    " · " + (META.tier === "all" ? "全段位" : (META.tier || "—"));

  function regionName(r) {
    for (var i = 0; i < REGIONS.length; i++) {
      if (REGIONS[i][0] === r) return REGIONS[i][1];
    }
    return r;
  }

  /* ---------- 维度 tab（切换时保持已选英雄与位置状态） ---------- */
  function setDim(dim) {
    state.dim = dim;
    Array.prototype.forEach.call(dimsEl.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b.dataset.dim === dim);
    });
    secLane.hidden = dim !== "lane";
    secDuo.hidden = dim !== "duo";
    secAram.hidden = dim !== "aram";
    srcEl.style.display = dim === "lane" ? "" : "none"; // duo/aram tab 有自己的来源标注
    if (dim === "lane") { renderHead(); renderResults(); }
    if (dim === "duo") { renderDuo(); }
    if (dim === "aram") { renderAram(); }
  }
  Array.prototype.forEach.call(dimsEl.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { setDim(b.dataset.dim); });
  });

  /* ---------- 地区筛选 ---------- */
  regionEl.value = state.region;
  function renderRegionHint() {
    // 对位/组合数据只有全球统计；地区切换只影响大乱斗
    if (state.region === "world") {
      laneRegionHintEl.hidden = true;
      laneRegionHintEl.textContent = "";
    } else {
      laneRegionHintEl.hidden = false;
      laneRegionHintEl.textContent =
        "对位与组合数据暂无分区统计，当前显示全球数据（地区筛选仅影响大乱斗榜）";
    }
  }
  regionEl.addEventListener("change", function () {
    state.region = regionEl.value;
    try { localStorage.setItem(LS_REGION, state.region); } catch (e) {}
    renderRegionHint();
    if (state.dim === "aram") renderAram();
  });
  renderRegionHint();

  /* ---------- 位置切换 ---------- */
  LANES.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = l[1];
    b.dataset.lane = l[0];
    if (l[0] === state.lane) b.classList.add("active");
    b.addEventListener("click", function () {
      state.lane = l[0];
      try { localStorage.setItem(LS_LANE, l[0]); } catch (e) {}
      Array.prototype.forEach.call(lanesEl.children, function (x) {
        x.classList.toggle("active", x.dataset.lane === l[0]);
      });
      renderHead();
      renderResults();
    });
    lanesEl.appendChild(b);
  });

  /* ---------- 搜索联想 ---------- */
  function norm(s) { return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, ''); }
  function candidates(query) {
    var raw = query.trim(), q = norm(raw);
    if (!q) return [];
    var out = [];
    for (var slug in CHAMPS) {
      if (!Object.prototype.hasOwnProperty.call(CHAMPS, slug)) continue;
      var c = CHAMPS[slug];
      var hit = norm(c.zh).indexOf(q) >= 0 || norm(c.en).indexOf(q) >= 0 ||
          (c.alias && norm(c.alias).indexOf(q) >= 0) ||
          (c.nicks && c.nicks.some(function (n) { return norm(n).indexOf(q) >= 0; }));
      if (hit) {
        out.push(slug);
        if (out.length >= 8) break;
      }
    }
    return out;
  }

  function renderSuggest() {
    var list = candidates(qEl.value);
    suggestEl.innerHTML = "";
    if (!qEl.value.trim()) { suggestEl.hidden = true; return; }
    if (!list.length) {
      var li = document.createElement("li");
      li.className = "nohit";
      li.textContent = "搜不到，换个关键词";
      suggestEl.appendChild(li);
    } else {
      list.forEach(function (slug) {
        var c = CHAMPS[slug];
        var li = document.createElement("li");
        li.innerHTML = esc(c.zh) + '<span class="en">' + esc(c.en) + "</span>";
        li.addEventListener("click", function () { select(slug); });
        suggestEl.appendChild(li);
      });
    }
    suggestEl.hidden = false;
  }

  qEl.addEventListener("input", renderSuggest);
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var list = candidates(qEl.value);
      if (list.length) select(list[0]);
    }
  });
  document.addEventListener("click", function (e) {
    if (!suggestEl.hidden && !e.target.closest(".searchbox")) suggestEl.hidden = true;
  });
  qEl.addEventListener("focus", renderSuggest);

  /* ---------- 最近搜索 ---------- */
  function renderRecent() {
    recentEl.innerHTML = "";
    if (!state.recent.length || qEl.value.trim()) return;
    var t = document.createElement("span");
    t.className = "rtitle";
    t.textContent = "最近搜索";
    recentEl.appendChild(t);
    state.recent.forEach(function (slug) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = CHAMPS[slug].zh;
      b.addEventListener("click", function () { select(slug); });
      recentEl.appendChild(b);
    });
  }
  qEl.addEventListener("input", renderRecent);

  /* ---------- 选中英雄 ---------- */
  function select(slug) {
    state.slug = slug;
    state.duoBack = false; // 换英雄后 duo tab 回到默认视图
    state.recent = [slug].concat(state.recent.filter(function (s) { return s !== slug; })).slice(0, 8);
    saveRecent();
    suggestEl.hidden = true;
    renderRecent();
    renderHead();
    renderResults();
    if (state.dim === "duo") renderDuo();
    if (state.dim === "aram") renderAram();
  }

  /* ---------- 出装/符文数据 ---------- */
  function buildOf(slug, lane) {
    var b = BUILDS[slug];
    return b ? b[lane] : null;
  }

  function renderHead() {
    if (!state.slug) { headEl.innerHTML = ""; return; }
    var c = nameOf(state.slug);
    var html = '<span class="zh">' + esc(c.zh) + '</span><span class="en">' + esc(c.en) + "</span>";
    var b = buildOf(state.slug, state.lane);
    if (b) {
      html += '<div class="buildsum">出装 ' + esc(b.items.join(" / ")) +
        " · 符文 " + esc(b.keystone) +
        " · 胜率 " + Number(b.wr).toFixed(1) + "%</div>";
    }
    headEl.innerHTML = html;
  }

  function buildLineHTML(slug, lane) {
    var b = buildOf(slug, lane);
    if (!b) return "";
    return '<div class="buildline">出装 ' + esc(b.items.join("/")) +
      " · 基石 " + esc(b.keystone) +
      " · 胜率 " + Number(b.wr).toFixed(1) + "%</div>";
  }

  /* ---------- 颜色带（按对手胜率） ---------- */
  function band(opp) {
    if (opp >= 57) return ["red", "硬counter"];
    if (opp >= 54) return ["orange", null];
    if (opp >= 52) return ["amber", null];
    if (opp >= 50) return ["gray", null];
    return ["green", null];
  }

  /* ---------- 分路 tab ---------- */
  Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      state.mode = b.dataset.mode;
      Array.prototype.forEach.call(tabsEl.children, function (x) {
        x.classList.toggle("active", x === b);
      });
      renderResults();
    });
  });

  /* ---------- 分路结果渲染 ---------- */
  function renderResults() {
    if (!state.slug) {
      resEl.innerHTML = '<div class="starthint">在上方搜索英雄，开始查询对位数据</div>';
      return;
    }
    var champData = DATA[state.slug] || {};
    var rows = champData[state.lane] || [];
    if (!rows.length) {
      resEl.innerHTML = '<div class="nodata">该位置暂无数据</div>';
      return;
    }
    rows = rows.slice();
    if (state.mode === "countered") {
      rows.sort(function (a, b) { return a[1] - b[1]; }); // wr 升序：被克制最惨在前
    } else {
      rows.sort(function (a, b) { return b[1] - a[1]; }); // wr 降序：它克制谁在前
    }
    var html = "";
    rows.forEach(function (r) {
      var slug = r[0], wr = r[1], games = r[2];
      var opp = 100 - wr; // 对手胜率
      var b = band(opp);
      var name = nameOf(slug);
      html += '<div class="row band-' + b[0] + '">' +
        '<div class="rowtop">' +
        '<div class="rname">' + esc(name.zh) + '<span class="en">' + esc(name.en) + "</span></div>" +
        '<div class="rstats">' +
          '<span class="oppwr ' + b[0] + '">' + opp.toFixed(1) + "%</span>" +
          (b[1] ? '<span class="badge">' + b[1] + "</span>" : "") +
          '<div class="games">' + games + " 局</div>" +
        "</div></div>" +
        buildLineHTML(slug, state.lane) +
        "</div>";
    });
    resEl.innerHTML = html;
  }

  /* ---------- 下路组合 ---------- */
  function duoRowHTML(slug, wr, games) {
    var c = nameOf(slug);
    return '<div class="duorow">' +
      '<div class="dname">' + esc(c.zh) + '<span class="en">' + esc(c.en) + "</span></div>" +
      '<div class="rstats"><span class="oppwr">' + Number(wr).toFixed(1) + "%</span>" +
      '<div class="games">' + games + " 局</div></div></div>";
  }

  function duoListHTML(rows, asc) {
    rows = (rows || []).slice();
    rows.sort(asc
      ? function (a, b) { return a[1] - b[1]; }
      : function (a, b) { return b[1] - a[1]; });
    if (!rows.length) return '<div class="nodata">暂无数据</div>';
    var html = "";
    rows.forEach(function (r) { html += duoRowHTML(r[0], r[1], r[2]); });
    return html;
  }

  function duoPairHTML(rows) {
    rows = (rows || []).slice();
    rows.sort(function (a, b) { return b[2] - a[2]; }); // 胜率降序
    if (!rows.length) return '<div class="nodata">暂无数据</div>';
    var html = "";
    rows.forEach(function (r) {
      var a = nameOf(r[0]), b = nameOf(r[1]);
      html += '<div class="duorow">' +
        '<div class="dname">' + esc(a.zh) + " + " + esc(b.zh) +
        '<span class="en">' + esc(a.en) + " + " + esc(b.en) + "</span></div>" +
        '<div class="rstats"><span class="oppwr">' + Number(r[2]).toFixed(1) + "%</span>" +
        '<div class="games">' + r[3] + " 局</div></div></div>";
    });
    return html;
  }

  function renderDuo() {
    if (!DUOS || !DUOS.meta) {
      duoMetaEl.textContent = "";
      duoResEl.innerHTML = '<div class="nodata">组合数据缺失</div>';
      return;
    }
    var m = DUOS.meta;
    duoMetaEl.textContent = "数据来源：" + (m.source || "—") +
      " · 版本 " + (m.patch || "—") +
      (m.patch_note ? " · " + m.patch_note : "");

    var bc = DUOS.by_champion || {};
    var html = "";
    if (state.slug && !state.duoBack && bc[state.slug]) {
      var c = nameOf(state.slug);
      html += '<button type="button" class="duoback" data-act="back">← 回全榜</button>';
      html += '<div class="duotitle">和 ' + esc(c.zh) + " 搭档胜率最高</div>";
      html += duoListHTML(bc[state.slug].best, false);
      html += '<details class="duoworst"><summary>最差搭档</summary>' +
        duoListHTML(bc[state.slug].worst, true) + "</details>";
    } else {
      if (state.slug && !bc[state.slug]) {
        html += '<div class="nodata">' + esc(nameOf(state.slug).zh) + " 暂无组合数据</div>";
      }
      html += '<div class="duotitle">下路组合全榜</div>';
      html += duoPairHTML(DUOS.ranking);
    }
    duoResEl.innerHTML = html;
  }

  duoResEl.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-act="back"]') : null;
    if (t) { state.duoBack = true; renderDuo(); }
  });

  /* ---------- 大乱斗 ---------- */
  function aramRows() {
    if (!ARAM || !ARAM.regions) return [];
    return ARAM.regions[state.region] || ARAM.regions.world || [];
  }

  function renderAram() {
    var rows = aramRows();
    var m = (ARAM && ARAM.meta) || {};
    aramMetaEl.textContent = "数据来源：u.gg · 大乱斗 · " + regionName(state.region) +
      " · 版本 " + (m.patch || "—");
    if (!rows.length) {
      aramHeroEl.hidden = true;
      aramResEl.innerHTML = '<div class="nodata">大乱斗数据缺失</div>';
      return;
    }
    // 已选英雄：顶部卡片 + 榜单中高亮定位
    var selIdx = -1;
    if (state.slug) {
      for (var i = 0; i < rows.length; i++) {
        if (rows[i][0] === state.slug) { selIdx = i; break; }
      }
    }
    if (selIdx >= 0) {
      var r = rows[selIdx], c = nameOf(state.slug);
      aramHeroEl.hidden = false;
      aramHeroEl.innerHTML =
        '<div class="aname">' + esc(c.zh) + '<span class="en">' + esc(c.en) + "</span></div>" +
        '<div class="astats">' +
        '<div><b>' + Number(r[1]).toFixed(1) + "%</b><span>胜率</span></div>" +
        '<div><b>#' + (selIdx + 1) + "</b><span>排名</span></div>" +
        '<div><b>' + r[2] + "</b><span>对局数</span></div>" +
        "</div>";
    } else {
      aramHeroEl.hidden = true;
      aramHeroEl.innerHTML = "";
    }
    aramTitleEl.textContent = "大乱斗胜率榜 · " + regionName(state.region);
    var html = "";
    rows.forEach(function (r, i) {
      var name = nameOf(r[0]);
      html += '<div class="aramrow' + (i === selIdx ? " hl" : "") + '"' +
        (i === selIdx ? ' id="aramsel"' : "") + ">" +
        '<div class="arank">' + (i + 1) + "</div>" +
        '<div class="dname">' + esc(name.zh) + '<span class="en">' + esc(name.en) + "</span></div>" +
        '<div class="rstats"><span class="oppwr">' + Number(r[1]).toFixed(1) + "%</span>" +
        '<div class="games">' + r[2] + " 局</div></div></div>";
    });
    aramResEl.innerHTML = html;
    if (selIdx >= 0) {
      var sel = $("aramsel");
      if (sel && sel.scrollIntoView) {
        try { sel.scrollIntoView({ block: "center" }); } catch (e) {}
      }
    }
  }

  /* ---------- 初始化 ---------- */
  renderRecent();
  if (state.recent.length) {
    select(state.recent[0]); // 打开即恢复上次看的英雄
  } else {
    renderResults();
  }
})();

</script>
</body>
</html>
